[workspace]
resolver = "2"
members = [
  "crates/engine-core",
  "crates/engine-dialects",
  "crates/engine-ffi",
  "crates/engine-server",
  "crates/engine-connectors/postgres",
  "crates/engine-connectors/jdbc-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
rust-version = "1.94"

[workspace.dependencies]
# DataFusion / Arrow move in lockstep. Bump datafusion, arrow, arrow-flight, tonic together.
datafusion = { version = "55.1.0", default-features = false, features = [
  "sql",
  "nested_expressions",
  "datetime_expressions",
  "string_expressions",
  "unicode_expressions",
  "regex_expressions",
  "math_expressions",
  "crypto_expressions",
  "encoding_expressions",
  "recursive_protection",
] }
datafusion-sql = { version = "55.1.0", features = ["unparser"] }
arrow = { version = "59.2.0", features = ["ffi", "prettyprint", "chrono-tz"] }
arrow-flight = { version = "59.2.0" }
tonic = "0.14.6"
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "macros", "time", "net", "signal"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dashmap = "6"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"

# Postgres connector (used from M3)
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1", "runtime"] }
deadpool-postgres = "0.14.2"
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chrono = "0.4"
rust_decimal = { version = "1", features = ["db-postgres"] }
uuid = { version = "1", features = ["v4"] }
rustls-native-certs = "0.8"
bytes = "1"

# build / test
cbindgen = "0.29.4"
libloading = "0.8"
insta = { version = "1", features = ["json"] }

[workspace.lints.clippy]
# EngineError carries structured fields for the JVM; boxing it everywhere buys nothing on the error path.
result_large_err = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
opt-level = 3
