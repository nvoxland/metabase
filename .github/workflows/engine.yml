name: Engine

# The native query engine (`engine/`): a Rust workspace built with Apache DataFusion.
# See dev/notes/datafusion-engine.md and engine/README.md.

on:
  push:
    branches:
      - master
      - "release-**"
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: engine

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:14-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: metabase
          POSTGRES_PASSWORD: password
          POSTGRES_DB: metabase_1
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The live connector tests and the sqllogictest harness (engine-slt) run against this server;
      # locally they skip when it is unreachable, here that is a failure.
      ENGINE_TEST_POSTGRES_DETAILS: '{"host":"localhost","port":5432,"dbname":"metabase_1","user":"metabase","password":"password","ssl":false}'
      MB_ENGINE_TESTS_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build the shared library
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Only mb_engine_ symbols are exported
        run: |
          set -euo pipefail
          exported=$(nm -D --defined-only target/debug/libmetabase_engine.so | awk '{print $3}' | grep -v '^mb_engine_' | grep -v '^_' || true)
          if [ -n "$exported" ]; then
            echo "Unexpected exported symbols:"; echo "$exported"; exit 1
          fi

  clojure-tests:
    name: Clojure engine tests
    needs: lint-and-test
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:14-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: metabase
          POSTGRES_PASSWORD: password
          POSTGRES_DB: metabase_1
          POSTGRES_HOST_AUTH_METHOD: trust
    env:
      CI: 'true'
      DRIVERS: postgres
      MB_POSTGRESQL_TEST_USER: metabase
      MB_POSTGRESQL_TEST_PASSWORD: password
      MB_ENGINE_TESTS_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Build the shared library
        run: cargo build -p engine-ffi
        working-directory: engine
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - name: Run the engine tests
        run: ./bin/test-agent :only-tags '[:mb/engine-tests]'
      - name: Gap measure (query-processor suites through the engine)
        # Informational until the engine passes them: how much of the query processor's own test
        # suite runs unchanged through the engine against Postgres. Read the summary line.
        continue-on-error: true
        env:
          MB_QUERY_ENGINE: datafusion
        run: >-
          ./bin/test-agent :only '[metabase.query-processor.aggregation-test
          metabase.query-processor.breakout-test
          metabase.query-processor.filter-test
          metabase.query-processor.expressions-test
          metabase.query-processor.date-bucketing-test
          metabase.query-processor.explicit-joins-test]'

  build-native:
    name: Build ${{ matrix.platform }}
    needs: lint-and-test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ${{ vars.DEFAULT_RUNNER_KEY }}
            target: x86_64-unknown-linux-gnu
            library: libmetabase_engine.so
          - platform: linux-aarch64
            runner: ${{ vars.DEFAULT_RUNNER_KEY_ARM || vars.DEFAULT_RUNNER_KEY }}
            target: aarch64-unknown-linux-gnu
            library: libmetabase_engine.so
          - platform: darwin-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            library: libmetabase_engine.dylib
          # The production image is Alpine: the loader looks for `linux-x86_64-musl`.
          - platform: linux-x86_64-musl
            runner: ${{ vars.DEFAULT_RUNNER_KEY }}
            target: x86_64-unknown-linux-musl
            library: libmetabase_engine.so
            musl: true
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: ${{ matrix.target }}
      - name: Install the musl toolchain
        if: ${{ matrix.musl }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        # `engine/.cargo/config.toml` turns off crt-static for musl so the result is a loadable cdylib.
        run: cargo build --release -p engine-ffi --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: ${{ matrix.musl && 'musl-gcc' || '' }}
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: metabase-engine-${{ matrix.platform }}
          path: engine/target/${{ matrix.target }}/release/${{ matrix.library }}
          if-no-files-found: error
